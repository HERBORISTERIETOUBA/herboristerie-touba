<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - HERBORISTERIE TOUBA</title>

    <link rel="stylesheet" href="admin.css">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<div class="login-box">

    <div class="login-logo">🌿</div>
    <h1>HERBORISTERIE TOUBA</h1>

    <p>Connexion à votre compte</p>

    <label class="login-label" for="email">Email</label>
    <input
        type="email"
        id="email"
        placeholder="votre@email.com">

    <label class="login-label" for="password">Mot de passe</label>
    <div class="login-password-wrap">
        <input
            type="password"
            id="password"
            placeholder="••••••••">
        <button type="button" id="togglePassword" class="login-eye" aria-label="Afficher le mot de passe">👁️</button>
    </div>

    <button type="button" id="forgotPasswordBtn" class="login-forgot">Mot de passe oublié ?</button>

    <button id="loginBtn">
        Se connecter
    </button>

    <div class="login-divider"><span>ou continuer avec</span></div>

    <button type="button" id="googleLoginBtn" class="login-oauth-btn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.1 5.1 29.3 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.9 19 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.1 5.1 29.3 3 24 3 16.2 3 9.4 7.4 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.2 0 9.9-1.7 13.5-4.7l-6.2-5.3C29.3 36.6 26.8 37.5 24 37.5c-5.3 0-9.7-3.4-11.3-8l-6.5 5C9.3 40.5 16.1 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.2 5.3C40.9 36.6 45 30.9 45 24c0-1.4-.1-2.7-.4-3.5z"/></svg>
        Google
    </button>

    <p id="message"></p>

</div>

<script type="module" src="admin.js"></script>

<script src="optional-images.js"></script>
</body>
</html>
